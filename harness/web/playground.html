<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator Playground — Luminfest</title>
<style>
  :root {
    /* The same tokens as the game runtime (docs/playground-design.md), so the launcher
       and the games it launches are visibly one product. */
    --bg: #F7F5EF; --panel: #FFFFFF; --inset: #F6F4ED; --border: #E5E7DB;
    --line-strong: #D3D7C7;
    --ink: #24312A; --dim: #5C6A60; --faint: #8D9A90;
    --accent: #3E7A55; --green: #3E7A55; --red: #A8422F; --gold: #8F6A1F;
    --a: #47519C; --b: #3E7A55; --c: #B35C2E; --d: #8F6A1F; --e: #7A3E8C;
    --radius: 12px;
    --e1: 0 1px 2px rgba(36,49,42,.06), 0 1px 1px rgba(36,49,42,.04);
    --e2: 0 4px 12px rgba(36,49,42,.07), 0 1px 3px rgba(36,49,42,.05);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5;
         -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }

  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header.top {
    display: flex; align-items: center; gap: 14px; padding: 14px 22px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  header.top h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.018em; }
  header.top .sub { color: var(--dim); font-size: 12.5px; }
  header.top .grow { flex: 1 1 auto; }
  header.top input {
    font: inherit; font-size: 12.5px; padding: 8px 11px; width: 240px;
    border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel);
    box-shadow: var(--e1);
  }
  header.top input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(62,122,85,.14); outline: none;
  }

  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 11px 22px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .filters select, .filters input[type=search] {
    font: inherit; font-size: 12.5px; padding: 8px 11px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
    box-shadow: var(--e1);
  }
  .filters select:focus, .filters input[type=search]:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(62,122,85,.14); outline: none;
  }
  .filters input[type=search] { flex: 1 1 200px; min-width: 160px; }
  .filters .count { color: var(--dim); font-size: 12.5px; margin-left: auto;
                    font-variant-numeric: tabular-nums; }

  main { display: flex; flex: 1 1 auto; min-height: 0; }

  .gallery { flex: 1 1 auto; overflow-y: auto; padding: 18px 22px 44px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 15px; cursor: pointer; display: flex; flex-direction: column; gap: 7px;
    box-shadow: var(--e1);
    transition: box-shadow .13s ease, transform .13s ease, border-color .13s ease;
  }
  .card:hover { box-shadow: var(--e2); transform: translateY(-2px); border-color: var(--line-strong); }
  .card[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--e2); }
  .card h3 { margin: 0; font-size: 13.5px; font-weight: 650; line-height: 1.35; }
  .card .prompt { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.45; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }

  .pill {
    font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--inset); color: var(--dim); border: 1px solid transparent; white-space: nowrap;
  }
  .pill.subject { background: #EDEFF9; color: var(--a); }
  .pill.difficulty-intro { background: #E7F2E9; color: var(--b); }
  .pill.difficulty-core { background: #F7EFDA; color: var(--d); }
  .pill.difficulty-stretch { background: #FCEAE4; color: var(--c); }
  .pill.scored { background: #E7F2E9; color: var(--b); }
  .pill.sandbox { background: #F0E9F4; color: var(--e); }

  .player {
    flex: 0 0 620px; border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .player-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .player-head h2 { font-size: 13.5px; margin: 0; font-weight: 650; }
  .player-head .grow { flex: 1 1 auto; }
  .player iframe { flex: 1 1 auto; width: 100%; border: 0; background: var(--bg); min-height: 0; }
  .player .empty { padding: 30px 22px; color: var(--dim); font-size: 13px; line-height: 1.6; }

  .verdict {
    flex: 0 0 auto; border-top: 1px solid var(--border); padding: 12px 16px;
    font-size: 12.5px; line-height: 1.5; display: none; max-height: 190px; overflow-y: auto;
  }
  .verdict[data-show="1"] { display: block; }
  .verdict[data-ok="1"] { background: #E7F2E9; color: var(--green); border-top-color: #BCD9C2; }
  .verdict[data-ok="0"] { background: #FCEAE4; color: var(--red); border-top-color: #EFC7BB; }
  .verdict[data-ok="2"] { background: var(--inset); color: var(--dim); }
  .verdict h4 { margin: 0 0 5px; font-size: 12.5px; }
  .verdict ul { margin: 5px 0 0 16px; padding: 0; }
  .verdict code { background: rgba(36,49,42,.06); padding: 1px 5px; border-radius: 5px; }

  button {
    font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 10px; cursor: pointer;
    padding: 8px 15px; border: 1px solid var(--line-strong); background: var(--panel);
    color: var(--ink); box-shadow: var(--e1);
    transition: box-shadow .12s ease, transform .12s ease, border-color .12s ease;
  }
  button:hover { border-color: var(--accent); box-shadow: var(--e2); transform: translateY(-1px); }
  button:active { transform: translateY(0) scale(.985); box-shadow: var(--e1); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), #4E8C66);
    border-color: transparent; color: #fff;
    box-shadow: 0 2px 6px rgba(62,122,85,.28), 0 1px 2px rgba(62,122,85,.20);
  }
  button.primary:hover { box-shadow: 0 6px 16px rgba(62,122,85,.32); }

  .section-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: .15em;
    color: var(--faint); margin: 24px 0 10px; font-weight: 700;
  }
  .notice {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold);
    border-radius: 10px; padding: 11px 14px; font-size: 12.5px; color: var(--dim);
    line-height: 1.55; box-shadow: var(--e1);
  }
  .runs { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--panel);
          border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .runs th, .runs td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--inset); }
  .runs th { background: var(--inset); font-weight: 600; font-size: 11px; color: var(--dim);
             text-transform: uppercase; letter-spacing: .06em; }
  .runs tr:last-child td { border-bottom: 0; }
  .ok { color: var(--green); font-weight: 600; }
  .no { color: var(--red); font-weight: 600; }
  .muted { color: var(--faint); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Simulator Playground</h1>
    <span class="sub" id="headline">loading…</span>
    <span class="grow"></span>
    <input id="token" type="password" placeholder="Paste access token" autocomplete="off">
    <button id="token-save">Use token</button>
  </header>

  <div class="filters">
    <select id="f-subject"><option value="">All subjects</option></select>
    <select id="f-course"><option value="">All courses</option></select>
    <select id="f-difficulty">
      <option value="">All levels</option>
      <option value="intro">Intro</option>
      <option value="core">Core</option>
      <option value="stretch">Stretch</option>
    </select>
    <input id="f-search" type="search" placeholder="Search games, concepts, interactions…">
    <span class="count" id="count"></span>
  </div>

  <main>
    <div class="gallery" id="gallery">
      <div class="grid" id="grid"></div>
      <div id="extras"></div>
    </div>

    <aside class="player">
      <div class="player-head">
        <h2 id="player-title">Pick a game</h2>
        <span class="grow"></span>
        <button id="reload" title="Reload the game">Reload</button>
      </div>
      <div class="empty" id="player-empty">
        Choose a game on the left. It runs here, offline, and reports what you
        worked out back to your own progress.
      </div>
      <iframe id="frame" sandbox="allow-scripts" title="Game" style="display:none"></iframe>
      <div class="verdict" id="verdict" data-show="0" data-ok="2"></div>
    </aside>
  </main>
</div>

<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'luminfest.token';           // same key the workbench uses
  var API = '/api/v1/playground';
  // `seenSeq` is the evidence guard: the highest `luminfest:outcome` sequence number this
  // page has already recorded for the frame currently loaded. It is reset every time a
  // new page is injected, because a freshly loaded game restarts its own counter at 1.
  var state = { games: [], current: null, artifacts: {}, token: '', seenSeq: -1 };

  var $ = function (id) { return document.getElementById(id); };

  function token() {
    return state.token || sessionStorage.getItem(STORAGE_KEY) || '';
  }

  function api(path, options) {
    options = options || {};
    var headers = { 'Content-Type': 'application/json' };
    var value = token();
    if (value) headers.Authorization = 'Bearer ' + value;
    return fetch(path, {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    }).then(function (response) {
      return response.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = { raw: text }; }
        if (!response.ok) {
          var detail = data && (data.detail || data.reason);
          throw new Error(detail || (response.status + ' ' + response.statusText));
        }
        return data;
      });
    });
  }

  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fill(select, values, label) {
    values.forEach(function (value) {
      var option = document.createElement('option');
      option.value = value; option.textContent = label ? label(value) : value;
      select.appendChild(option);
    });
  }

  // ------------------------------------------------------------------ gallery

  function loadGallery() {
    return api(API).then(function (data) {
      state.games = data.games || [];
      $('headline').textContent = state.games.length + ' games · ' +
        (data.archetypes || 0) + ' interaction types · offline';
      fill($('f-subject'), data.subjects || []);
      fill($('f-course'), data.courses || []);
      render();
      renderExtras(data);
      loadRuns();
    }).catch(function (error) {
      $('headline').textContent = 'not loaded';
      $('grid').innerHTML = '<div class="notice"><b>Could not load the playground.</b><br>' +
        escapeHtml(error.message) + '<br><br>Paste an access token above — the same one the ' +
        'workbench uses — and press <b>Use token</b>.</div>';
    });
  }

  function visible() {
    var subject = $('f-subject').value;
    var course = $('f-course').value;
    var difficulty = $('f-difficulty').value;
    var query = $('f-search').value.trim().toLowerCase();
    return state.games.filter(function (game) {
      if (subject && (game.subjects || []).indexOf(subject) === -1) return false;
      if (course && game.course_id !== course) return false;
      if (difficulty && game.difficulty !== difficulty) return false;
      if (query) {
        var haystack = [game.title, game.concept, game.interaction, game.course_id,
                        (game.tags || []).join(' '), game.archetype].join(' ').toLowerCase();
        if (haystack.indexOf(query) === -1) return false;
      }
      return true;
    });
  }

  function render() {
    var games = visible();
    $('count').textContent = games.length + ' of ' + state.games.length + ' shown';
    $('grid').innerHTML = games.map(function (game) {
      var pills = (game.subjects || []).map(function (s) {
        return '<span class="pill subject">' + escapeHtml(s) + '</span>';
      }).join('');
      pills += '<span class="pill difficulty-' + escapeHtml(game.difficulty) + '">' +
        escapeHtml(game.difficulty) + '</span>';
      pills += game.scored
        ? '<span class="pill scored">scored</span>'
        : '<span class="pill sandbox">sandbox</span>';
      if (game.minutes) pills += '<span class="pill">~' + escapeHtml(game.minutes) + ' min</span>';
      return '<div class="card" data-slug="' + escapeHtml(game.slug) + '" tabindex="0" role="button">' +
        '<h3>' + escapeHtml(game.title) + '</h3>' +
        '<p class="prompt">' + escapeHtml(game.prompt) + '</p>' +
        '<div class="meta">' + pills + '</div></div>';
    }).join('') || '<div class="notice">No games match those filters.</div>';

    Array.prototype.forEach.call($('grid').querySelectorAll('.card'), function (card) {
      var open = function () { play(card.getAttribute('data-slug')); };
      card.addEventListener('click', open);
      card.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); }
      });
    });
  }

  function renderExtras(data) {
    var html = '';
    if (data.withheld && data.withheld.length) {
      html += '<div class="section-title">Withheld games</div>' +
        '<div class="notice"><b>' + data.withheld.length + ' game(s) could not be loaded.</b> ' +
        'They are listed rather than hidden, so a content bug is visible here and not only ' +
        'to a learner who hit it.<ul>' + data.withheld.map(function (row) {
          return '<li><code>' + escapeHtml(row.slug) + '</code> — ' + escapeHtml(row.reason) + '</li>';
        }).join('') + '</ul></div>';
    }
    html += '<div class="section-title">Recent runs</div><div id="runs-host"></div>';
    $('extras').innerHTML = html;
  }

  function loadRuns() {
    var host = $('runs-host');
    if (!host) return;
    api(API + '/runs?limit=15').then(function (data) {
      var runs = data.runs || [];
      if (!runs.length) {
        host.innerHTML = '<div class="notice">No runs yet. Play a scored game and the ' +
          'result appears here — and moves your progress on that concept.</div>';
        return;
      }
      host.innerHTML = '<table class="runs"><thead><tr><th>Game</th><th>Concept</th>' +
        '<th>Result</th><th>Tries</th><th>Mastery</th></tr></thead><tbody>' +
        runs.map(function (run) {
          var delta = (run.mastery_after != null && run.mastery_before != null)
            ? (run.mastery_after - run.mastery_before) : null;
          return '<tr><td>' + escapeHtml(run.slug) + '</td>' +
            '<td>' + escapeHtml(run.concept_id || '—') + '</td>' +
            '<td class="' + (run.correct ? 'ok' : 'no') + '">' +
              (run.correct ? 'correct' : 'not yet') + '</td>' +
            '<td>' + escapeHtml(run.tries) + '</td>' +
            '<td>' + (delta == null ? '<span class="muted">not attributed</span>'
                                    : (delta >= 0 ? '+' : '') + delta.toFixed(3)) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }).catch(function () {
      host.innerHTML = '<div class="notice">Run history is unavailable for this token.</div>';
    });
  }

  // ------------------------------------------------------------------- player

  function play(slug) {
    state.current = slug;
    var game = state.games.filter(function (g) { return g.slug === slug; })[0];
    $('player-title').textContent = game ? game.title : slug;
    $('verdict').setAttribute('data-show', '0');
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
      card.setAttribute('aria-selected', card.getAttribute('data-slug') === slug ? 'true' : 'false');
    });

    // Store the game as a versioned artifact first, so a run can be traced back to
    // the exact bytes it was played from. Idempotent per content revision.
    var ready = state.artifacts[slug]
      ? Promise.resolve(state.artifacts[slug])
      : api(API + '/games/' + encodeURIComponent(slug) + '/instantiate', { method: 'POST' })
          .then(function (data) { state.artifacts[slug] = data.artifact_id; return data.artifact_id; })
          .catch(function () { return ''; });

    ready.then(function (artifactId) {
      state.artifacts[slug] = artifactId;
      return api(API + '/games/' + encodeURIComponent(slug) + '/html');
    }).then(function () {
      // The page is fetched with the bearer header and injected with srcdoc, because an
      // iframe src cannot carry an Authorization header. The iframe is sandboxed with
      // allow-scripts and no allow-same-origin, so the game runs in an opaque origin and
      // cannot reach this page's session token.
      return fetch(API + '/games/' + encodeURIComponent(slug) + '/html', {
        headers: { Authorization: 'Bearer ' + token() }
      }).then(function (response) {
        if (!response.ok) throw new Error('Could not load the game (' + response.status + ')');
        return response.text();
      });
    }).then(function (html) {
      $('player-empty').style.display = 'none';
      var frame = $('frame');
      frame.style.display = 'block';
      // A new page starts its own outcome counter at 1, so the evidence guard is reset
      // with it. Keeping the old watermark would silently discard the new game's first
      // commit; not resetting it at all would let a replay across games slip through.
      state.seenSeq = -1;
      frame.srcdoc = html;
    }).catch(function (error) {
      $('player-empty').style.display = 'block';
      $('frame').style.display = 'none';
      $('player-empty').innerHTML = '<b>This game did not open.</b><br>' +
        escapeHtml(error.message);
    });
  }

  function verdict(ok, title, lines) {
    var node = $('verdict');
    node.setAttribute('data-show', '1');
    node.setAttribute('data-ok', ok ? '1' : '0');
    node.innerHTML = '<h4>' + escapeHtml(title) + '</h4>' + lines.map(function (line) {
      return '<div>' + line + '</div>';
    }).join('');
  }

  // The game reports upward through postMessage. Only `luminfest:outcome` is evidence;
  // `luminfest:readout` is live state for display and is never recorded.
  window.addEventListener('message', function (event) {
    // Trust boundary, first gate. The iframe runs *generated* game code under
    // sandbox="allow-scripts", so what arrives here is untrusted input, not a message
    // from a friend. Accept only the frame this page itself created; anything else -
    // another frame, a stray extension, this page's own window - is ignored before it
    // can reach either the live title or the evidence log.
    if (event.source !== $('frame').contentWindow) return;
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'luminfest:readout') {
      if (state.current) $('player-title').textContent =
        (state.games.filter(function (g) { return g.slug === state.current; })[0] || {}).title +
        ' · ' + Object.keys(data).filter(function (key) {
          return ['type', 'archetype', 'at_ms'].indexOf(key) === -1;
        }).map(function (key) { return key + ' ' + data[key]; }).join(', ');
      return;
    }
    if (data.type !== 'luminfest:outcome' || !state.current) return;
    // Shape, before anything is forwarded. `correct` is the load-bearing claim - a run
    // that does not say whether the learner was right is not evidence - so it must be a
    // real boolean; the route's non-strict model would otherwise coerce the string
    // 'yes' into true. `tries` and `detail` are checked only when the frame sends them,
    // because not every archetype reports a try count, and a malformed one is dropped
    // rather than forwarded. Nothing is copied out of the payload into `detail`: the
    // frame's own object is forwarded as-is, so the row can never gain a key the frame
    // invented under another name.
    if (typeof data.correct !== 'boolean') return;
    var tries = data.tries === undefined ? 1 : Number(data.tries);
    if (!isFinite(tries)) return;
    var detail = data.detail === undefined ? {} : data.detail;
    if (!detail || typeof detail !== 'object' || Array.isArray(detail)) return;
    // De-duplicate on the frame's own sequence number. The runtime stamps every outcome
    // with a counter that starts at 1 and only ever increases, so the highest number
    // already recorded is a watermark: a redelivered message carries a seq at or below
    // it and is dropped, while a genuinely new commit - a second task, or a retry after
    // `next` - carries a higher one and is recorded. Keying on the slug would be wrong:
    // it would swallow every commit after the first. The watermark is reset when a new
    // page is injected, because a freshly loaded game restarts its own counter at 1.
    // The watermark advances as soon as a message is accepted, not when the POST
    // resolves: that makes delivery at-most-once, so a retried duplicate cannot become
    // a second row if the first response was merely lost.
    var seq = Number(data.seq);
    if (isFinite(seq)) {
      if (seq <= state.seenSeq) return;
      state.seenSeq = seq;
    }
    api(API + '/games/' + encodeURIComponent(state.current) + '/outcome', {
      method: 'POST',
      body: {
        correct: data.correct,
        artifact_id: state.artifacts[state.current] || '',
        task_id: String(data.shock || data.task || ''),
        tries: Math.max(1, Math.min(50, Math.round(tries))),
        elapsed_ms: typeof data.elapsed_ms === 'number' ? Math.round(data.elapsed_ms) : null,
        detail: detail
      }
    }).then(function (result) {
      var lines = [];
      if (result.attributed) {
        lines.push('Recorded against <code>' + escapeHtml(result.concept_id) + '</code>. ' +
          escapeHtml(result.attribution) + '.');
        if (result.mastery_before != null && result.mastery_after != null) {
          lines.push('Your progress on this concept: ' +
            Number(result.mastery_before).toFixed(3) + ' → ' +
            Number(result.mastery_after).toFixed(3) +
            ' (' + (result.mastery_delta >= 0 ? '+' : '') +
            Number(result.mastery_delta).toFixed(3) + ').');
        }
      } else {
        lines.push('Recorded, but not credited to a concept in your course: ' +
          escapeHtml(result.attribution) + '.');
      }
      verdict(!!data.correct, data.correct ? 'Correct' : 'Recorded', lines);
      loadRuns();
    }).catch(function (error) {
      verdict(false, 'Not recorded', [escapeHtml(error.message)]);
    });
  });

  // ----------------------------------------------------------------- controls

  $('token-save').addEventListener('click', function () {
    state.token = $('token').value.trim();
    if (state.token) sessionStorage.setItem(STORAGE_KEY, state.token);
    else sessionStorage.removeItem(STORAGE_KEY);
    state.artifacts = {};
    loadGallery();
  });
  $('reload').addEventListener('click', function () {
    if (state.current) play(state.current);
  });
  ['f-subject', 'f-course', 'f-difficulty'].forEach(function (id) {
    $(id).addEventListener('change', render);
  });
  $('f-search').addEventListener('input', render);

  var stored = sessionStorage.getItem(STORAGE_KEY);
  if (stored) $('token').value = stored;
  loadGallery();
})();
</script>
</body>
</html>
