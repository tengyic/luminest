[pytest]
testpaths = tests

# A ceiling on any single test, so a suite cannot hang.
#
# The symptom this exists for: a full run of this suite stopped making progress at
# ``test_api.py::test_receipts_hiding_idempotence_and_variants`` and sat there for the
# better part of two hours, twice. That test passes in 1.1s on its own, so what blocks is
# an interaction with state a previous test left behind - a locked database, a thread that
# never joined. Without a timeout the run reports nothing at all: no stack, no failing
# test, just a process that has to be killed, and the whole suite's result is lost.
#
# ``thread`` rather than ``signal`` because these tests drive an ASGI app in-process and
# some of them block inside a worker thread; the thread method dumps every thread's stack,
# which is what makes the dump diagnostic rather than just a verdict.
#
# The value is generous on purpose. A tight ceiling here would convert slow-but-correct
# tests into flakes, and a flaky gate is worse than a slow one.
timeout = 300
timeout_method = thread
